<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader by Vinod</title>
</head>
<body>
     <div class="outer"></div>
     <div class="inner"></div>
    <style>
        body{
            background: yellowgreen;
        }
        div{
            position: absolute;
            background-color: yellowgreen;
            inset: 50%;
            border-radius: 50%;
        }
        .outer{
            width: 50px;
    height: 50px;
    background: conic-gradient(rgb(90, 5, 5) 45%, yellowgreen 93%);
    animation: roll 1s   infinite;
    transform: rotate(360deg);
    animation-timing-function: linear;
    /*opecity: .7;     (fake opecity )*/ 

        }
        @keyframes roll {
            0%{
                transform: rotate(0);
            }
            100%{
                transform: rotate(360deg);
            }
        }
       .inner{
    width: 35px;
    height: 35px;
    translate: 21% 21%; 
       } 
    </style>
</body>
</html>

<style>
    *{
        padding:0;
        margin:0;
    }
    .profile {
        display: flex;
        justify-content: center;
        align-items: right;
        
        padding: 30px;

         .dropbtn {
        background-color: transparent;
        padding: 6px 0px 6px 0p;
        font-size: 20px;
        border: none;
        border-radius: 20%;
        cursor: pointer;
    }

    .dropbtn:hover,
    .dropbtn:focus {
        color: blanchedalmond;
        border:none;
    }

    .dropdown {
        position: relative;
        display: inline-block;
          border-radius: 10px;
    }

    .dropdown-content {
    display: none;
    position: absolute;
    border-radius: 10px;
    background-color: #98bdf1;
    min-width: 300px;
    box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
    z-index: 1;
    right: 0;
}
   
    .account a{
        button{
            color: rgb(0 0 0);
            font-family: inherit;
            border: hidden;
            font-weight: 500;
            background-color: #f0ffdb;
            padding: 5px;
            border-radius: 5px;
        }
       
    }
    .dropdown-content a,h3,h4,img{
        color: black;
        padding: 2px 0px 5px 22px;
        text-decoration: none;
        display: block;
        font-family: system-ui;
        font-size: medium;
    }
    .drheading{
        color: rgb(0, 0, 0);
        padding: 7px 0px 4px 18px;
        text-decoration: none;
        display: block;
        font-family: monospace;
    }

    .dropdown-content a:hover {
        background-color: #677653;
    }

    .show {
        display: block;
    }
    }
      
</style>
<script>
    function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
    }
    window.onclick = function (event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
                var openDrp = dropdowns[i];
                if (openDrp.classList.contains('show')) {
                    openDrp.classList.remove('show');
                }
            }
        }
    }
</script>

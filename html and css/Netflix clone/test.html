<style>
body {
    background-color: #141414;
    color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* Prevent horizontal scroll on body */
}

.container {
    display: flex;
}

/* Sidebar Navigation */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 80px;
    height: 100vh;
    background-color: #000;
    display: flex;
    justify-content: center;
    padding-top: 20px;
    z-index: 100;
}

.sidebar ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 35px;
}

.sidebar ul li a {
    color: #b3b3b3;
    font-size: 24px;
    text-decoration: none;
    transition: color 0.3s;
}

.sidebar ul li a:hover {
    color: #fff;
}

.sidebar ul li.active a {
    color: #e50914;
}

/* Main Content Area */
.main-content {
    margin-left: 80px; /* Same as sidebar width */
    width: calc(100% - 80px);
}

/* Hero Section */
.hero-section {
    position: relative;
    height: 70vh;
    background-image: linear-gradient(to right, rgba(0, 0, 0, 0.8) 20%, rgba(0, 0, 0, 0)), url('[suspicious link removed]');
    background-size: cover;
    background-position: center top;
    display: flex;
    align-items: center;
    padding-left: 50px;
}

.hero-content {
    max-width: 500px;
}

.series-logo {
    font-size: 20px;
    font-weight: bold;
    color: #e50914;
    letter-spacing: 2px;
}

.series-logo .series-text {
    color: #fff;
}

.title {
    font-size: 80px;
    font-weight: 800;
    margin: 10px 0;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.subtitle {
    font-size: 24px;
    font-weight: bold;
    margin: 0 0 20px 0;
}

.meta {
    display: flex;
    gap: 20px;
    font-size: 16px;
    color: #a3a3a3;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    gap: 15px;
}

.btn {
    padding: 12px 30px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background-color 0.3s;
}

.btn-play {
    background-color: #e50914;
    color: #fff;
}

.btn-play:hover {
    background-color: #f40612;
}

.btn-trailer {
    background-color: rgba(109, 109, 110, 0.7);
    color: #fff;
}

.btn-trailer:hover {
    background-color: rgba(109, 109, 110, 0.4);
}

/* Content Rows */
.content-row {
    padding: 20px 50px;
}

.content-row h2 {
    font-size: 24px;
    margin-bottom: 15px;
}

.poster-list {
    display: flex;
    gap: 10px;
    overflow-x: auto; /* Enable horizontal scrolling */
    overflow-y: hidden;
    padding-bottom: 20px; /* Space for scrollbar */
}

/* Hide scrollbar but keep functionality */
.poster-list::-webkit-scrollbar {
    display: none;
}

.poster-list {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
}

.poster-list img {
    width: 180px;
    height: auto;
    border-radius: 4px;
    transition: transform 0.3s ease;
    cursor: pointer;
}

.poster-list img:hover {
    transform: scale(1.05);
    z-index: 10;
}
</style>

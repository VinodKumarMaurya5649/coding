<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatiable" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator by vinod</title>
</head>
<body>
<div class="container">
    <div class="calculator">
        <input type="text" id="inputBox" placeholder="0" />
        <div><h5>Desined by Vinod Kumar Maurya</h5></div>
        <div>
            <button class="button operator">AC</button>
            <button class="button operator">DEL</button>
            <button class="button operator">%</button>
            <button class="button operator">/</button>
        </div>
        <div>
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button operator">*</button>
        </div>
        <div>
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button operator">-</button>
        </div>
        <div>
            <button class="button" >1</button>
            <button class="button" >2</button>
            <button class="button" >3</button>
            <button class="button operator">+</button>
        </div>
        <div>
            <button class="button">00</button>
            <button class="button">0</button>
            <button class="button">.</button>
            <button class="button equlBtn">=</button>
        </div>
    </div>
</div>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mooli&display=swap');
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Mooli', sans-serif;
}
h5{
    text-align: center;
    color: #35010134;
    margin: 10px;
}
body{
    width:100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(60deg, #2c011a,#e76937);
}
.calculator{
    border: 1px solid #a07291;
    padding: 20px;
    border-radius: 12px;
    background: transparent;
    box-shadow: 0px 4px 18px rgba(168, 147, 147, 0.6);
}
input{
    width: 300px;
    border: none;
    padding: 25px;
    margin: 10px;
    background: transparent;
    box-shadow: 0px 4px 18px rgba(173, 166, 172, 0.144);
    font-size: 40px;
    text-align: right;
    cursor: pointer;
}
input::placeholder{
    color: #000000;
}
button{
    border: none;
    width: 70px;
    height: 70px;
    margin: 10px;
    border-radius: 50%;
    background: transparent;
    color: #ffffff;
    font-size: 25px;
    box-shadow: -7px -7px 15px rgba(63, 9, 2, 0.993);
    cursor: pointer;
}
.equlBtn{
    background-color:#07c01691;
} 
.operator{
    color: #a9f002;
}
    </style>
    <script>
        let input = document.getElementById('inputBox');
let buttons = document.querySelectorAll('button');

let string = "";
let arr = Array.from(buttons);
arr.forEach(button => {
    button.addEventListener('click', (e) =>{
        if(e.target.innerHTML == '='){
            string = eval(string);
            input.value = string;
        }

        else if(e.target.innerHTML == 'AC'){
            string = "";
            input.value = string;
        }
        else if(e.target.innerHTML == 'DEL'){
            string = string.substring(0, string.length-1);
            input.value = string;
        }
        else{
            string += e.target.innerHTML;
            input.value = string;
        }
        
    })
})
    </script>
    
</body>
</html>
